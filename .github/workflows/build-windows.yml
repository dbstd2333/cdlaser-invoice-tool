name: Build & Release (Windows)

# 参考 https://cn.electron-vite.org/guide/distribution#github-action-ci-cd
# 触发条件：
#   - push tag v*.*.*：构建并发布到 GitHub Release（草稿）
#   - pull_request 到 main：CI 验证构建是否通过
#   - workflow_dispatch：手动触发构建
on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# softprops/action-gh-release 创建 Release 需要仓库写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # .npmrc 配置 node-linker=hoisted，better-sqlite3 会在此时按 Node ABI 编译原生模块
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Windows installer
        # build:win = electron-vite build && electron-builder --win --x64
        # electron-builder 会针对 Electron ABI 重新编译 better-sqlite3，并生成 NSIS 安装包到 release/
        run: pnpm build:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
          draft: true
          generate_release_notes: true
